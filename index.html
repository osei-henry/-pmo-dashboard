const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
        key, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, k, b64(PAYLOAD.data));
  return new TextDecoder().decode(buf);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  if(!window.crypto || !crypto.subtle){ err.textContent = "This page must be opened over https."; return; }
  try {
    const html = await unlock(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch(_) { err.textContent = "Wrong password."; }
});
